<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nayely ❤️</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ==========================
   ESTILOS GENERALES
========================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=2070&auto=format&fit=crop') center center/cover no-repeat;
}

/* Oscurecer ligeramente el fondo */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
}

/* ==========================
   TARJETA CENTRAL
========================== */
.card{
    position:relative;
    z-index:10;
    width:90%;
    max-width:700px;
    text-align:center;
    padding:35px;
    border-radius:25px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    color:white;
    animation:fadeIn 1.2s ease;
}

.title{
    font-family:'Great Vibes', cursive;
    font-size:4rem;
    color:#ffd7ea;
    margin-bottom:10px;
}

.question{
    font-size:2rem;
    font-weight:600;
    margin-bottom:10px;
}

.signature{
    font-size:1.1rem;
    color:#fff4f7;
    margin-bottom:25px;
}

.phrase{
    font-size:1rem;
    line-height:1.7;
    margin-bottom:30px;
    color:#fff;
}

/* ==========================
   BOTONES
========================== */
.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    position:relative;
}

button{
    border:none;
    cursor:pointer;
    padding:14px 28px;
    border-radius:50px;
    font-size:1.1rem;
    transition:.35s;
    font-weight:600;
}

#yesBtn{
    background:linear-gradient(45deg,#ff4d88,#ff85a2);
    color:white;
    box-shadow:0 5px 20px rgba(255,105,180,.4);
}

#yesBtn:hover{
    transform:translateY(-3px);
}

#noBtn{
    background:white;
    color:#d6336c;
}

#noBtn:hover{
    transform:translateY(-3px);
}

.message{
    margin-top:20px;
    color:#fff8fb;
    font-size:1.1rem;
    min-height:30px;
}

/* ==========================
   PÉTALOS
========================== */
.petal{
    position:absolute;
    top:-20px;
    color:#ffd1dc;
    font-size:18px;
    animation:fall linear infinite;
    pointer-events:none;
}

@keyframes fall{
    from{
        transform:translateY(-10vh) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

/* ==========================
   CORAZONES
========================== */
.heart{
    position:absolute;
    color:#ff4d88;
    font-size:25px;
    animation:floatHeart 4s linear forwards;
    pointer-events:none;
}

@keyframes floatHeart{
    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    100%{
        opacity:0;
        transform:translateY(-600px) scale(2);
    }
}

/* ==========================
   CELEBRACIÓN
========================== */
.celebration{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
}

.spark{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    animation:spark 2s linear forwards;
}

@keyframes spark{
    from{
        opacity:1;
        transform:translate(0,0);
    }
    to{
        opacity:0;
        transform:translate(var(--x),var(--y));
    }
}

/* ==========================
   ANIMACIONES
========================== */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ==========================
   RESPONSIVE
========================== */
@media(max-width:768px){

    .title{
        font-size:3rem;
    }

    .question{
        font-size:1.5rem;
    }

    button{
        font-size:1rem;
        padding:12px 22px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1 class="title">Nayely ❤️</h1>

    <div class="question">
        ¿Quieres ser mi novia?
    </div>

    <div class="signature">
        Atte. Víctor
    </div>

    <div class="phrase">
        Desde que llegaste a mi vida, cada día tiene un motivo especial para sonreír.
        Me harías muy feliz si aceptaras compartir esta historia conmigo. ❤️
    </div>

    <div class="buttons">
        <button id="yesBtn">Sí ❤️</button>
        <button id="noBtn">No 💔</button>
    </div>

    <div class="message" id="message"></div>

</div>

<div class="celebration" id="celebration"></div>

<script>

/* ==================================
   FRASES ROMÁNTICAS
================================== */

const phrases = [
    "¿Estás segura? ❤️",
    "Piénsalo una vez más 🥺",
    "Prometo hacerte feliz 🌹",
    "Eres muy especial para mí 💖",
    "Dame una oportunidad ✨"
];

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

let attempts = 0;
let yesScale = 1;
let noScale = 1;

/* ==================================
   BOTÓN NO
================================== */

noBtn.addEventListener("click", () => {

    attempts++;

    message.textContent =
        phrases[Math.floor(Math.random()*phrases.length)];

    yesScale += 0.15;
    noScale -= 0.12;

    if(noScale < 0.25){
        noScale = 0.25;
    }

    yesBtn.style.transform = `scale(${yesScale})`;
    noBtn.style.transform = `scale(${noScale})`;

    // Después de varios intentos se mueve
    if(attempts >= 4){

        const maxX = window.innerWidth - noBtn.offsetWidth - 30;
        const maxY = window.innerHeight - noBtn.offsetHeight - 30;

        noBtn.style.position = "fixed";
        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
    }
});

/* ==================================
   BOTÓN SÍ
================================== */

yesBtn.addEventListener("click", () => {

    document.querySelector(".card").innerHTML = `
        <h1 class="title">❤️ ¡Gracias! ❤️</h1>

        <div style="
            font-size:1.5rem;
            margin-top:20px;
            line-height:1.8;
        ">
            ¡Gracias por aceptar, Nayely! ❤️<br>
            Hoy comienza una historia muy bonita.
        </div>
    `;

    createHeartExplosion();
    createCelebration();
});

/* ==================================
   CORAZONES
================================== */

function createHeartExplosion(){

    for(let i=0;i<120;i++){

        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";

        heart.style.left =
            Math.random()*window.innerWidth+"px";

        heart.style.bottom = "0px";

        heart.style.fontSize =
            (15 + Math.random()*30)+"px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },4000);
    }
}

/* ==================================
   CELEBRACIÓN VISUAL
================================== */

function createCelebration(){

    const container =
        document.getElementById("celebration");

    const colors = [
        "#ff4d88",
        "#ffd700",
        "#ffffff",
        "#ff99bb",
        "#ff6b6b"
    ];

    for(let i=0;i<200;i++){

        const spark =
            document.createElement("div");

        spark.classList.add("spark");

        spark.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        spark.style.left =
            window.innerWidth/2 + "px";

        spark.style.top =
            window.innerHeight/2 + "px";

        spark.style.setProperty(
            "--x",
            (Math.random()*1000-500)+"px"
        );

        spark.style.setProperty(
            "--y",
            (Math.random()*1000-500)+"px"
        );

        container.appendChild(spark);

        setTimeout(()=>{
            spark.remove();
        },2000);
    }
}

/* ==================================
   PÉTALOS CAYENDO
================================== */

function createPetal(){

    const petal =
        document.createElement("div");

    petal.classList.add("petal");
    petal.innerHTML = "🌸";

    petal.style.left =
        Math.random()*100+"vw";

    petal.style.animationDuration =
        (6 + Math.random()*8)+"s";

    petal.style.opacity =
        Math.random();

    petal.style.fontSize =
        (15 + Math.random()*15)+"px";

    document.body.appendChild(petal);

    setTimeout(()=>{
        petal.remove();
    },15000);
}

setInterval(createPetal, 300);

</script>

</body>
</html>
